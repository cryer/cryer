<svg width="480" height="64" viewBox="0 0 480 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fabd2f">
        <animate attributeName="stop-color" values="#fabd2f;#b8bb26;#8ec07c;#d3869b;#fe8019;#fabd2f" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#b8bb26">
        <animate attributeName="stop-color" values="#b8bb26;#8ec07c;#d3869b;#fe8019;#fabd2f;#b8bb26" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8ec07c">
        <animate attributeName="stop-color" values="#8ec07c;#d3869b;#fe8019;#fabd2f;#b8bb26;#8ec07c" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fabd2f"/>
      <stop offset="100%" stop-color="#fe8019"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 底板 -->
  <rect x="3" y="3" width="474" height="58" rx="12" fill="#1d2021"/>

  <!-- 霓虹渐变边框 -->
  <rect x="3" y="3" width="474" height="58" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="2" filter="url(#glow)"/>

  <!-- λ 图标 -->
  <text x="30" y="41" font-family="Fira Code, Menlo, Consolas, monospace" font-size="26" font-weight="bold" fill="url(#titleGrad)" filter="url(#glow)">λ</text>

  <!-- 主标题 -->
  <text x="64" y="30" font-family="Fira Code, Menlo, Consolas, monospace" font-size="17" font-weight="bold" fill="url(#titleGrad)">cryer&#39;s Blog</text>

  <!-- 副标题 -->
  <text x="64" y="49" font-family="Fira Code, Menlo, Consolas, monospace" font-size="10.5" fill="#a89984">Deep Learning &#183; AI &#183; Systems Programming</text>

  <!-- 闪烁光标 -->
  <rect x="205" y="20" width="8" height="15" fill="#fabd2f">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- 呼吸箭头 -->
  <text x="438" y="39" font-family="Fira Code, Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#b8bb26" filter="url(#glow)">
    -&gt;
    <animateTransform attributeName="transform" type="translate" values="0 0; 6 0; 0 0" dur="1.4s" repeatCount="indefinite"/>
  </text>
</svg>
